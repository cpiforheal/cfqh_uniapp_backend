    <path d="M60 64 L60 40 Q60 28 48 28 L42 28" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M60 40 Q60 28 72 28 L78 28" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round"/>
